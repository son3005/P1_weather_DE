name: CI Pipeline

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    test-and-lint:
        name: Lint, Test  & Build Models
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER:  ${{ secrets.POSTGRES_USER || 'postgres' }}
                    POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'admin' }}
                    POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'P1' }}
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 5            
        steps:
              - name: Checkout repository
                uses: actions/checkout@v4

              - name: Set up Python 3.11
                uses: actions/setup-python@v5
                with:
                  python-version: "3.11"
                  cache: "pip"
                
              - name: Install Python dependencies
                run: |
                  python -m pip install  --upgrade pip
                  pip install -r requirements.txt
                
              - name: 1. Code Quality & Linting (Ruff)
                run: |
                  ruff check .
                
              - name: 2. Run Unit Test (Pytest)
                run: |
                  pytest -v
                
              - name: 3. Test dbt Models & Quality Tests
                env:
                  POSTGRES_HOST: localhost
                  POSTGRES_PORT: 5432
                  POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'postgres' }}
                  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'admin' }}
                  POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'P1' }}
                run: |
                  cd transform
                  dbt seed --profiles-dir .
                  dbt test --select dim_city dim_date --profiles-dir .

